<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="E-DOP — Achetez, nous vous livrons. Expédition aérienne France → Gabon : 2 départs par semaine, suivi de colis, tarifs au kilo." />
    <meta name="theme-color" content="#e5308f" />
    <title>E-DOP — Achetez, nous vous livrons</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Thème résolu avant le premier pixel : pas de flash blanc sur un
         appareil en mode sombre. « auto » suit le réglage du système. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('edop_theme') || 'auto';
          var dark = saved === 'dark' ||
            (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
